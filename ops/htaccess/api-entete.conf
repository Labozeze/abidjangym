# --- Ajouté au déploiement par Eric (Entité C), avant les règles de Laravel ---
# CDC §6.1 (HTTPS) et §6.5 (en-têtes). La CSP et Permissions-Policy du
# backoffice sont gérées par l'application (le scan QR a besoin de la caméra).

<IfModule mod_rewrite.c>
  RewriteEngine On
  RewriteCond %{HTTPS} !=on
  RewriteCond %{HTTP:X-Forwarded-Proto} !https
  RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [L,R=301]
</IfModule>

<IfModule mod_headers.c>
  Header always set Strict-Transport-Security "max-age=31536000; includeSubDomains"
  Header always set X-Content-Type-Options "nosniff"
  Header always set X-Frame-Options "DENY"
  Header always set Referrer-Policy "strict-origin-when-cross-origin"
  Header always set X-Robots-Tag "noindex, nofollow"
</IfModule>

# Fichiers sensibles jamais servis (CDC §6.4)
<FilesMatch "^\.(env|git)">
  Require all denied
</FilesMatch>
