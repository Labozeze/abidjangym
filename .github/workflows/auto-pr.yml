# Ouverture automatique des PR — maintenue par Eric (Entité C)
# Une entité n'a besoin que de « git push » : la PR vers develop est créée ici,
# avec le message du dernier commit comme titre et description.
name: PR automatique

on:
  push:
    branches: ['feature/**', 'hotfix/**']

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  ouvrir-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Créer la PR si elle n'existe pas
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "Une PR est déjà ouverte pour $BRANCH."
            exit 0
          fi

          case "$BRANCH" in
            feature/a-*) LABEL="entite-a" ;;
            feature/b-*) LABEL="entite-b" ;;
            feature/c-*) LABEL="entite-c" ;;
            *)           LABEL="" ;;
          esac

          # Dernier commit qui n'est pas une fusion : une entité peut avoir fusionné
          # develop dans sa branche juste avant de pousser (AGENTS.md §3.5).
          git fetch --quiet origin develop
          LIVRAISON=$(git log -1 --no-merges --format=%H origin/develop..HEAD)
          LIVRAISON=${LIVRAISON:-$(git log -1 --format=%H)}
          TITRE=$(git log -1 --format=%s "$LIVRAISON")
          git log -1 --format=%b "$LIVRAISON" > corps.md
          [ -s corps.md ] || echo "_Description manquante : voir le modèle de message de commit dans AGENTS.md._" > corps.md
          printf '\n\n---\n_PR ouverte automatiquement à partir de la branche `%s`._\n' "$BRANCH" >> corps.md

          ARGS=(--base develop --head "$BRANCH" --title "$TITRE" --body-file corps.md)
          [ -n "$LABEL" ] && ARGS+=(--label "$LABEL")
          gh pr create "${ARGS[@]}"
